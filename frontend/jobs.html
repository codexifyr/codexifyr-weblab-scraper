<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job History · Codexifyr</title><link rel="icon" href="/assets/favicon.ico"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#7a2cff"><link rel="stylesheet" href="/assets/style.css"></head><body><header class="topbar"></header><main class="container"><div class="page-title"><span class="eyebrow">Persistent workspaces</span><h1>Job History</h1><p>Running, interrupted, stopped, failed and completed scans are stored separately. Moving between pages never stops a job.</p></div><section class="panel"><div class="actions" style="justify-content:flex-start;margin-top:0"><button class="btn" onclick="loadJobs()">Refresh</button><a class="btn primary" href="/scraper">New Website Scan</a><a class="btn" href="/repair">New File Repair</a><a class="btn" href="/shopify">New Shopify Scrape</a></div><div id="jobs" class="tablewrap"><div class="empty">Loading jobs…</div></div></section><footer class="footer"></footer></main><script src="/assets/app.js"></script><script>
shell('/jobs');footer();async function act(id,a){try{await post(`/api/jobs/${id}/${a}`);loadJobs()}catch(e){alert(e.message)}}async function loadJobs(){let {jobs}=await api('/api/jobs');if(!jobs.length){$('#jobs').innerHTML='<div class="empty">No jobs yet.</div>';return}$('#jobs').innerHTML=`<table class="table"><thead><tr><th>Job</th><th>Type</th><th>Status</th><th>Progress</th><th>Products / Variants</th><th>Elapsed</th><th>Actions</th></tr></thead><tbody>${jobs.map(j=>`<tr><td><b>${esc(j.domain||j.name)}</b><br><span class="code">${esc(j.id)}</span></td><td>${esc(j.type)}</td><td>${jobStatusTag(j)}<br><span style="color:var(--muted)">${esc(j.message||'')}</span></td><td>${j.progress||0}%</td><td>${j.products||0} / ${j.variants||0}</td><td>${fmtTime(j.elapsed)}</td><td><div class="actions" style="margin:0;justify-content:flex-start">${['interrupted','stopped','error'].includes(j.status)?`<button class="btn green" onclick="act('${j.id}','resume')">Resume</button>`:''}${j.running?`<button class="btn danger" onclick="act('${j.id}','pause')">Pause</button>`:''}<a class="btn" href="/validation?validator=${j.type==='shopify'?'shopify':'wordpress'}&job=${j.id}">Validate</a>${j.type==='shopify'&&j.csv_ready?`<a class="btn green" href="/api/download?job=${j.id}&type=shopify-csv">Download CSV</a>`:''}${j.package_ready?`<a class="btn primary" href="/api/download?job=${j.id}&type=package">Download ZIP</a>`:''}</div></td></tr>`).join('')}</tbody></table>`}loadJobs();setInterval(loadJobs,3000);
</script></body></html>
